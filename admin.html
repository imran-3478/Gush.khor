<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GushKhor Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #1f2937;
    }

    .header {
      background: #087443;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: white;
      color: #087443;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .login-box,
    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .login-box {
      max-width: 430px;
      margin: 70px auto;
    }

    h2 {
      margin-bottom: 20px;
      color: #087443;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 11px 17px;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      background: #087443;
      color: white;
      font-size: 16px;
    }

    .login-btn:hover {
      background: #065c35;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .refresh-btn {
      background: #087443;
      color: white;
    }

    .report-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      background: #fff;
    }

    .report-card h3 {
      color: #087443;
      margin-bottom: 12px;
    }

    .info {
      margin: 7px 0;
      line-height: 1.5;
    }

    .details-preview {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      color: #4b5563;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .view-btn {
      background: #2563eb;
      color: white;
    }

    .view-btn:hover {
      background: #1d4ed8;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .approve:hover {
      background: #15803d;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .reject:hover {
      background: #b91c1c;
    }

    .delete-btn {
      background: #7f1d1d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .delete-btn:hover {
      background: #991b1b;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
    }

    .tab-btn.active {
      border-color: #059669;
      background: #ecfdf5;
      color: #059669;
    }

    .status {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #6b7280;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 25px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 15px;
      top: 12px;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      padding: 0;
      font-size: 22px;
      line-height: 35px;
    }

    .modal-close:hover {
      background: #dc2626;
    }

    .modal-title {
      color: #087443;
      margin-bottom: 20px;
      padding-right: 40px;
    }

    .modal-row {
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .modal-row strong {
      display: block;
      margin-bottom: 6px;
      color: #374151;
    }

    .modal-details {
      white-space: pre-wrap;
      line-height: 1.7;
      color: #111827;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {

      .header h1 {
        font-size: 18px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

      .modal-actions {
        flex-direction: column;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header hidden" id="adminHeader">

    <h1>🛡️ GushKhor Admin Panel</h1>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </header>


  <!-- LOGIN -->

  <div
    class="container"
    id="loginSection"
  >

    <div class="login-box">

      <h2>🔐 Admin Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        onclick="login()"
      >
        Login
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- ADMIN PANEL -->

  <main
    class="container hidden"
    id="adminSection"
  >

    <div class="panel">

      <div class="topbar">

        <div>

          <h2 id="panelTitle">📋 Pending Reports</h2>

          <p id="panelDesc">
            নতুন রিপোর্ট যাচাই করে Approve অথবা Reject করুন।
          </p>

        </div>

        <button
          class="refresh-btn"
          onclick="loadReports()"
        >
          🔄 Refresh
        </button>

      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">⏳ Pending</button>
        <button class="tab-btn" id="tabApproved" onclick="switchTab('approved')">✅ Approved</button>
      </div>

      <div id="reportsList"></div>

    </div>

  </main>


  <!-- DETAILS MODAL -->

  <div
    id="detailsModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <button
        class="modal-close"
        onclick="closeModal()"
      >
        ×
      </button>

      <h2 class="modal-title">
        📄 সম্পূর্ণ Report Details
      </h2>

      <div id="modalBody"></div>

    </div>

  </div>


<script>

  // ==========================================
  // SUPABASE CONFIG
  // ==========================================

  const SUPABASE_URL =
    "https://dzsgcrgcotwxruhqrder.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_zGiw90qepHGQKdhaJ5v9pw_pVbUwHcE";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // LOGIN
  // ==========================================

  async function login() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "Email এবং Password দিন।",
        "error"
      );

      return;
    }


    showMessage(
      "Login হচ্ছে...",
      "success"
    );


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        "Login failed: " +
        error.message,
        "error"
      );

      return;
    }


    await checkAdmin(data.user);

  }


  // ==========================================
  // CHECK ADMIN
  // ==========================================

  async function checkAdmin(user) {

    const { data, error } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (error) {

      showMessage(
        "Admin verification failed: " +
        error.message,
        "error"
      );

      await supabaseClient.auth.signOut();

      return;
    }


    if (!data) {

      showMessage(
        "আপনার এই Admin Panel ব্যবহারের অনুমতি নেই।",
        "error"
      );

      await supabaseClient.auth.signOut();

      return;
    }


    document
      .getElementById("loginSection")
      .classList.add("hidden");


    document
      .getElementById("adminHeader")
      .classList.remove("hidden");


    document
      .getElementById("adminSection")
      .classList.remove("hidden");


    loadReports();

  }


  // ==========================================
  // LOAD PENDING REPORTS
  // ==========================================

  let currentTab = "pending";

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabPending").classList.toggle("active", tab === "pending");
    document.getElementById("tabApproved").classList.toggle("active", tab === "approved");
    document.getElementById("panelTitle").textContent = tab === "pending" ? "📋 Pending Reports" : "✅ Approved Reports";
    document.getElementById("panelDesc").textContent = tab === "pending"
      ? "নতুন রিপোর্ট যাচাই করে Approve অথবা Reject করুন।"
      : "অনুমোদিত রিপোর্ট — প্রয়োজনে Delete করুন।";
    loadReports();
  }

  async function deleteReport(id) {
    const c1 = confirm("⚠️ আপনি কি এই রিপোর্টটি স্থায়ীভাবে DELETE করতে চান?");
    if (!c1) return;
    const c2 = confirm("⚠️ শেষবার জিজ্ঞেস করছি — রিপোর্টটি মুছে যাবে, ফিরিয়ে আনা যাবে না। নিশ্চিত?");
    if (!c2) return;

    const { error } = await supabaseClient
      .from("reports")
      .delete()
      .eq("id", id);

    if (error) {
      alert("❌ Delete failed:\n" + error.message);
      return;
    }

    alert("✅ রিপোর্ট মুছে ফেলা হয়েছে।");
    loadReports();
  }

  async function loadReports() {

    const reportsList =
      document.getElementById("reportsList");


    reportsList.innerHTML =
      "<div class='empty'>⏳ Reports loading...</div>";


    const { data, error } =
      await supabaseClient
        .from("reports")
        .select(
          "id,district,office,amount,incident_date,details,status,created_at"
        )
        .eq("status", currentTab)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      reportsList.innerHTML =
        "<div class='empty'>" +
        "❌ Reports load করা যায়নি।<br><br>" +
        escapeHTML(error.message) +
        "</div>";

      return;
    }


    if (!data || data.length === 0) {

      reportsList.innerHTML =
        "<div class='empty'>" +
        "✅ বর্তমানে কোনো Pending Report নেই।" +
        "</div>";

      return;
    }


    reportsList.innerHTML =
      data
        .map(report => {

          const amount =
            report.amount !== null &&
            report.amount !== undefined
              ? Number(report.amount)
                  .toLocaleString("bn-BD") +
                " টাকা"
              : "উল্লেখ নেই";


          const date =
            report.incident_date
              ? formatDate(
                  report.incident_date
                )
              : "উল্লেখ নেই";


          const preview =
            report.details
              ? report.details.length > 140
                ? report.details.substring(
                    0,
                    140
                  ) + "..."
                : report.details
              : "কোনো বিবরণ নেই";


          return `

            <div class="report-card">

              <span class="status">
                ⏳ Pending
              </span>

              <h3>
                ${escapeHTML(
                  report.office ||
                  "অফিস উল্লেখ নেই"
                )}
              </h3>

              <div class="info">
                📍 <strong>জেলা:</strong>
                ${escapeHTML(
                  report.district ||
                  "উল্লেখ নেই"
                )}
              </div>

              <div class="info">
                💰 <strong>ঘুষের পরিমাণ:</strong>
                ${amount}
              </div>

              <div class="info">
                📅 <strong>ঘটনার তারিখ:</strong>
                ${date}
              </div>

              <div class="details-preview">
                📝 ${escapeHTML(preview)}
              </div>

              <div class="actions">

                <button
                  class="view-btn"
                  onclick="viewReport('${report.id}')"
                >
                  👁️ View Details
                </button>

                ${currentTab === "pending" ? `
                <button
                  class="approve"
                  onclick="updateReport(
                    '${report.id}',
                    'approved'
                  )"
                >
                  ✅ Approve
                </button>

                <button
                  class="reject"
                  onclick="updateReport(
                    '${report.id}',
                    'rejected'
                  )"
                >
                  ❌ Reject
                </button>
                ` : `
                <button
                  class="delete-btn"
                  onclick="deleteReport('${report.id}')"
                >
                  🗑️ Delete
                </button>
                `}

              </div>

            </div>

          `;

        })
        .join("");

  }


  // ==========================================
  // VIEW FULL REPORT
  // ==========================================

  async function viewReport(id) {

    const { data, error } =
      await supabaseClient
        .from("reports")
        .select(
          "id,district,office,amount,incident_date,details,status,created_at"
        )
        .eq("id", id)
        .single();


    if (error) {

      alert(
        "Report details পাওয়া যায়নি:\n" +
        error.message
      );

      return;
    }


    const amount =
      data.amount !== null &&
      data.amount !== undefined
        ? Number(data.amount)
            .toLocaleString("bn-BD") +
          " টাকা"
        : "উল্লেখ নেই";


    const incidentDate =
      data.incident_date
        ? formatDate(
            data.incident_date
          )
        : "উল্লেখ নেই";


    const createdDate =
      data.created_at
        ? new Date(
            data.created_at
          ).toLocaleString("bn-BD")
        : "উল্লেখ নেই";


    document
      .getElementById("modalBody")
      .innerHTML = `

        <div class="modal-row">

          <strong>
            📍 জেলা
          </strong>

          ${escapeHTML(
            data.district ||
            "উল্লেখ নেই"
          )}

        </div>


        <div class="modal-row">

          <strong>
            🏢 অফিস
          </strong>

          ${escapeHTML(
            data.office ||
            "উল্লেখ নেই"
          )}

        </div>


        <div class="modal-row">

          <strong>
            💰 ঘুষের পরিমাণ
          </strong>

          ${amount}

        </div>


        <div class="modal-row">

          <strong>
            📅 ঘটনার তারিখ
          </strong>

          ${incidentDate}

        </div>


        <div class="modal-row">

          <strong>
            🕐 রিপোর্ট জমা দেওয়ার সময়
          </strong>

          ${createdDate}

        </div>


        <div class="modal-row">

          <strong>
            📌 বর্তমান Status
          </strong>

          ${escapeHTML(
            data.status ||
            "unknown"
          )}

        </div>


        <div class="modal-row">

          <strong>
            📝 সম্পূর্ণ অভিযোগ
          </strong>

          <div class="modal-details">

            ${escapeHTML(
              data.details ||
              "কোনো বিস্তারিত তথ্য নেই।"
            )}

          </div>

        </div>


        <div class="modal-actions">

          <button
            class="approve"
            onclick="
              closeModal();
              updateReport(
                '${data.id}',
                'approved'
              )
            "
          >
            ✅ Approve
          </button>


          <button
            class="reject"
            onclick="
              closeModal();
              updateReport(
                '${data.id}',
                'rejected'
              )
            "
          >
            ❌ Reject
          </button>

        </div>

      `;


    document
      .getElementById("detailsModal")
      .classList.remove("hidden");

  }


  // ==========================================
  // CLOSE MODAL
  // ==========================================

  function closeModal() {

    document
      .getElementById("detailsModal")
      .classList.add("hidden");

  }


  // Close modal when clicking outside

  document
    .getElementById("detailsModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeModal();

        }

      }
    );


  // ==========================================
  // APPROVE / REJECT
  // ==========================================

  async function updateReport(
    id,
    newStatus
  ) {

    const action =
      newStatus === "approved"
        ? "Approve"
        : "Reject";


    const confirmed =
      confirm(
        `আপনি কি এই Report-টি ${action} করতে চান?`
      );


    if (!confirmed) {

      return;

    }


    const { error } =
      await supabaseClient
        .from("reports")
        .update({
          status: newStatus
        })
        .eq("id", id);


    if (error) {

      alert(
        "❌ Update failed:\n" +
        error.message
      );

      return;

    }


    alert(
      newStatus === "approved"
        ? "✅ Report Approved হয়েছে।"
        : "❌ Report Rejected হয়েছে।"
    );


    loadReports();

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient
      .auth
      .signOut();

    location.reload();

  }


  // ==========================================
  // EXISTING SESSION
  // ==========================================

  async function checkExistingSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      session &&
      session.user
    ) {

      await checkAdmin(
        session.user
      );

    }

  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(
    message,
    type
  ) {

    const box =
      document
        .getElementById(
          "loginMessage"
        );


    box.innerHTML =
      escapeHTML(message);


    box.className =
      "message " + type;


    box.style.display =
      "block";

  }


  // ==========================================
  // SECURITY: ESCAPE HTML
  // ==========================================

  function escapeHTML(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // DATE FORMAT
  // ==========================================

  function formatDate(
    value
  ) {

    try {

      return new Date(
        value
      ).toLocaleDateString(
        "bn-BD",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    } catch {

      return value;

    }

  }


  // ==========================================
  // START
  // ==========================================

  checkExistingSession();

</script>

</body>
</html>
